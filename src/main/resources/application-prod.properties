# ==========================================
# APPLICATION
# ==========================================
spring.application.name=gathbandhan
server.port=${SERVER_PORT:9090}

# ==========================================
# JWT SECURITY
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIKARI CONNECTION POOL
# Pool size 50 is tuned for concurrent async background broadcast executors (concurrency=25),
# WebSocket sessions, and HTTP request threads on PostgreSQL without exhausting database connections.
# ==========================================
spring.datasource.hikari.pool-name=GathbandhanPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# FLYWAY & DATABASE MIGRATIONS
# Migrations V1 through V135 are strictly sequential, so out-of-order execution is disabled in production.
# ==========================================
spring.flyway.enabled=true
spring.flyway.out-of-order=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ==========================================
# REDIS & CACHE
# SimpleCache handles in-memory master data caching, while Redis manages pub/sub & session tokens.
# ==========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000

spring.cache.type=simple

# ==========================================
# FILE UPLOAD
# Max upload size limited to 10MB to mitigate denial-of-service risks in production.
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

file.upload-dir=${FILE_UPLOAD_DIR:/opt/gathbandhan/uploads}

# ==========================================
# JACKSON
# ==========================================
spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.default-property-inclusion=non_null

# ==========================================
# RESPONSE COMPRESSION & TOMCAT
# ==========================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,image/svg+xml

server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# DEVTOOLS (DISABLED IN PRODUCTION)
# ==========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=true

# ==========================================
# MAIL
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM}

# ==========================================
# APPLICATION URLS
# ==========================================
app.backend-url=${BACKEND_URL}
app.frontend-url=${FRONTEND_URL}
app.base-url=${BASE_URL}

# ==========================================
# LOGGING (PRODUCTION SAFE)
# ==========================================
logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.stat=OFF

# ==========================================
# ERROR HANDLING
# Exclude detailed messages, binding errors, and stacktraces from error responses.
# ==========================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ==========================================
# CORS
# ==========================================
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ==========================================
# SMS
# ==========================================
app.sms.enabled=${SMS_ENABLED:false}
msg91.auth.key=${MSG91_AUTH_KEY:}

# ==========================================
# RAZORPAY
# ==========================================
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}

# ==========================================
# PROKERALA
# ==========================================
prokerala.api.client-id=${PROKERALA_CLIENT_ID}
prokerala.api.client-secret=${PROKERALA_CLIENT_SECRET}
prokerala.api.base-url=${PROKERALA_BASE_URL:https://api.prokerala.com}

# ==========================================
# RECAPTCHA
# ==========================================
recaptcha.enabled=${RECAPTCHA_ENABLED:true}
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.score-threshold=0.5
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# ==========================================
# SSL / TLS
# HTTPS is terminated by the reverse proxy (Nginx/Cloudflare) on VPS.
# ==========================================
server.ssl.enabled=false

# ==========================================
# SUBSCRIPTIONS & EXPIRY WORKFLOW
# ==========================================
subscription.reminder.days=7,5,3,2,1
subscription.reminder.cron=0 0 9 * * *
subscription.expiry.scheduler.cron=0 0 9 * * *
subscription.expiry.scheduler.enabled=true
subscription.expiry.scheduler.zone=Asia/Kolkata
subscription.expiry.max-attempts=3

# ==========================================
# SEEDER (DISABLED IN PRODUCTION)
# ==========================================
app.seeder.enabled=false
app.seed.default-users=false
app.profile-completion.enabled=true

# Dormant seed settings preserved for compatibility
app.seeder.total-users=1000000
app.seeder.batch-size=10000
app.seeder.total-interests=3000000
app.seeder.total-shortlists=2000000
app.seeder.total-conversations=500000
app.seeder.min-messages=5
app.seeder.max-messages=20
app.seeder.premium-percentage=20
app.seeder.total-likes=5000000

# ==========================================
# MONITORING (ACTUATOR & PROMETHEUS)
# Health endpoint is public for uptime monitoring, while detailed metrics require authentication.
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true

# ==========================================
# BROADCAST & RABBITMQ PERFORMANCE TUNING
# ==========================================
broadcast.test-mode=false
broadcast.chunk-size=100
broadcast.email.batch-size=100

# RabbitMQ Bulk App Consumer Tuning
broadcast.rabbitmq.bulk-app.concurrency=15
broadcast.rabbitmq.bulk-app.max-concurrency=25
broadcast.rabbitmq.bulk-app.prefetch=200

# RabbitMQ Bulk Email Consumer Tuning
broadcast.rabbitmq.bulk-email.concurrency=5
broadcast.rabbitmq.bulk-email.max-concurrency=10
broadcast.rabbitmq.bulk-email.prefetch=50

# Bulk Email Strategy Configuration
app.email.bulk-api-key=${BULK_EMAIL_API_KEY}
app.email.provider-name=${BULK_EMAIL_PROVIDER_NAME:Gathbandhan-Bulk-API-Provider}

# RabbitMQ Connection Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
