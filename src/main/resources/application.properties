# ==========================================
# APPLICATION
# ==========================================
spring.application.name=gathbandhan
server.port=9090

# ==========================================
# JWT
# ==========================================
jwt.secret=mySuperSecretKeyForJwtTokenThatIsVerySecure12345
jwt.expiration=86400000

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/gathbandhan_perf
spring.datasource.username=postgres
spring.datasource.password=Pgsql@9090
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIKARI CONNECTION POOL
# ==========================================
spring.datasource.hikari.pool-name=GathbandhanPool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
//spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true

# ==========================================
# SQL INIT
# ==========================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ==========================================
# REDIS
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000

spring.cache.type=simple
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload-dir=uploads/

# ==========================================
# JACKSON
# ==========================================
spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.default-property-inclusion=non_null

# ==========================================
# RESPONSE COMPRESSION
# ==========================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,image/svg+xml

# ==========================================
# TOMCAT
# ==========================================
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

# ==========================================
# UTF-8
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# DEVTOOLS
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=false

# ==========================================
# MAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourgmail@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=yourgmail@gmail.com

# ==========================================
# URLS
# ==========================================
app.backend-url=https://localhost:9090
app.frontend-url=https://localhost:3000
app.base-url=https://localhost:9090

# ==========================================
# LOGGING (FAST)
# ==========================================
logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
//logging.level.org.hibernate.SQL=OFF
//logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


spring.jpa.properties.hibernate.generate_statistics=FALSE
logging.level.org.hibernate.stat=OFF
# ==========================================
# ERROR
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ==========================================
# CORS
# ==========================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ==========================================
# SMS
# ==========================================
app.sms.enabled=false
msg91.auth.key=test

# ==========================================
# RAZORPAY
# ==========================================
razorpay.api.key=rzp_test_xxxxxxxxx
razorpay.api.secret=xxxxxxxxxxxxxxxx

# ==========================================
# PROKERALA
# ==========================================
prokerala.api.client-id=test
prokerala.api.client-secret=test
prokerala.api.base-url=https://api.prokerala.com

# ==========================================
# RECAPTCHA
# ==========================================
recaptcha.site-key=6LebOGgtAAAAAICdniWguB6ag-3qh0CFyBVzCkdj
recaptcha.secret-key=6LebOGgtAAAAAJ3aefcF6jjwzQIBOLolpM6xz5aH
recaptcha.score-threshold=0.5
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# ==========================================
# SSL
# ==========================================
server.ssl.enabled=false
server.ssl.key-store=classpath:localhost.p12
server.ssl.key-store-password=gathbandhan123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=gathbandhan

# ==========================================
# SUBSCRIPTIONS & EXPIRY WORKFLOW
# ==========================================
subscription.reminder.days=7,5,3,2,1
subscription.reminder.cron=0 0 9 * * *
subscription.expiry.scheduler.cron=0 0 9 * * *
subscription.expiry.scheduler.enabled=true
subscription.expiry.scheduler.zone=Asia/Kolkata
subscription.expiry.max-attempts=3

# ==========================================
# SEEDER
# ==========================================
app.seeder.enabled=false
app.seed.default-users=true
app.profile-completion.enabled=true

app.seeder.total-users=1000000
app.seeder.batch-size=10000
app.seeder.total-interests=3000000
app.seeder.total-shortlists=2000000
app.seeder.total-conversations=500000
app.seeder.min-messages=5
app.seeder.max-messages=20
app.seeder.premium-percentage=20
app.seeder.total-likes=5000000