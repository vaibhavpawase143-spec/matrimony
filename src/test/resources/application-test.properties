# ==========================================
# GATHBANDHAN TEST PROFILE CONFIGURATION
# ==========================================
spring.application.name=gathbandhan-test
server.port=0

# JWT SECURITY FOR TESTING
jwt.secret=TestSecretKeyForAntigravityMatrimonyTestingProfile1234567890!
jwt.expiration=3600000

# DATABASE CONFIGURATION
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/gathbandhan_perf}
spring.datasource.username=${TEST_DATABASE_USERNAME:postgres}
spring.datasource.password=${TEST_DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI CONNECTION POOL FOR TESTS
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# FLYWAY SCHEMA MIGRATIONS
spring.flyway.enabled=true
spring.flyway.out-of-order=true

# DISABLE BACKGROUND SCHEDULERS & SEEDERS IN TESTS
app.seeder.enabled=false
subscription.expiry.scheduler.enabled=false

# DISABLE RABBITMQ CONNECTION & LISTENERS IN TESTS
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# DISABLE / MOCK EXTERNAL SERVICES IN TESTS
app.sms.enabled=false
recaptcha.enabled=false
broadcast.test-mode=true
app.bypass.enabled=true

# REDIS CACHE FOR TESTS
spring.cache.type=simple

# FILE UPLOAD FOR TESTS
file.upload-dir=${java.io.tmpdir}/gathbandhan-test-uploads

# EXTERNAL APIS MOCK SETTINGS
prokerala.api.client-id=test-client-id
prokerala.api.client-secret=test-client-secret
prokerala.api.base-url=http://localhost:9999
razorpay.api.key=rzp_test_mockkey
razorpay.api.secret=mocksecret

# ACTUATOR HEALTH CHECK SETTINGS FOR TEST PROFILE
management.health.rabbit.enabled=false
management.health.mail.enabled=false
management.health.redis.enabled=false

# RATE LIMITING FOR TESTS
security.rate-limit.enabled=true
security.rate-limit.trusted-proxies=10.0.0.1,192.168.1.1
security.rate-limit.user-login.max-attempts=5
security.rate-limit.user-login.window-seconds=900
security.rate-limit.user-login.block-duration-seconds=900
security.rate-limit.admin-login.max-attempts=4
security.rate-limit.admin-login.window-seconds=900
security.rate-limit.admin-login.block-duration-seconds=900
security.rate-limit.forgot-password.max-attempts=3
security.rate-limit.forgot-password.window-seconds=900
security.rate-limit.forgot-password.block-duration-seconds=60
security.rate-limit.email-verification.max-attempts=3
security.rate-limit.email-verification.window-seconds=900
security.rate-limit.email-verification.block-duration-seconds=60
security.rate-limit.reset-password.max-attempts=5
security.rate-limit.reset-password.window-seconds=900
security.rate-limit.reset-password.block-duration-seconds=900
security.rate-limit.registration.max-attempts=5
security.rate-limit.registration.window-seconds=3600
security.rate-limit.registration.block-duration-seconds=3600

